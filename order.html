<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Weekly meal order form for Full Fridge Co. clients.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://fullfridgeco.com/order.html">

  <!-- Social share preview (Facebook, iMessage, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Full Fridge Co.">
  <meta property="og:title" content="Weekly Order | Full Fridge Co.">
  <meta property="og:description" content="Weekly meal order form for Full Fridge Co. clients.">
  <meta property="og:image" content="https://fullfridgeco.com/images/social-share.png">
  <meta property="og:url" content="https://fullfridgeco.com/order.html">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#fbf6ea">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..700,100;1,9..144,500,100&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The sketchy pencil effect for all the drawings. Keep this on every page. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="sketchy" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header and referral banner come from js/site.js -->
  <div id="site-header"></div>

  <main id="main">

    <section class="page-hero">
      <div class="container page-hero__grid">
        <div>
          <span class="eyebrow">For clients</span>
          <h1>Pick your meals for this week</h1>
          <p class="lede">Choose your meals or skip the week by Friday at noon. If I don't hear from you, you'll get Chef's Picks.</p>
          <p style="margin-top:1rem"><a class="text-link" href="menu.html">See the full menu with ingredients</a></p>
        </div>
        <svg class="doodle" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g filter="url(#sketchy)"><rect x="24" y="16" width="48" height="68" rx="5" class="fill-mustard-soft"/><rect x="20" y="12" width="48" height="68" rx="5" class="line"/><path class="line line--thin" d="M30 26 L58 26"/><circle cx="31" cy="40" r="3" class="fill-mustard"/><path class="line line--thin" d="M38 40 L58 40"/><circle cx="31" cy="52" r="3" class="fill-mustard"/><path class="line line--thin" d="M38 52 L55 52"/><circle cx="31" cy="64" r="3" class="fill-mustard"/><path class="line line--thin" d="M38 64 L57 64"/><path class="line" d="M28 39 L31 43 L36 35"/><path class="line" d="M28 63 L31 67 L36 59"/><path class="fill-olive" d="M74 34 L82 38 L64 80 L58 78 Z" opacity="0.85"/><path class="line" d="M72 32 L80 36 L62 78 L56 84 L55 76 Z"/></g></svg>
      </div>
    </section>

    <section class="section section--tint" aria-label="Weekly order form">
      <div class="container narrow">
        <!-- =========================================================
             TALLY ORDER FORM: replace this placeholder box with your
             Tally embed code. In Tally, open your form, click Share,
             choose Embed, and copy the code. It looks something like:
             <iframe data-tally-src="https://tally.so/embed/YOURFORMID?alignLeft=1&hideTitle=1&transparentBackground=1"
               loading="lazy" width="100%" height="800" frameborder="0" title="Weekly order"></iframe>
             <script src="https://tally.so/widgets/embed.js"></script>
             ========================================================= -->
        <div class="embed-slot">
          <strong>Tally order form goes here</strong>
          <p>Paste your Tally embed code in this spot.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer comes from js/site.js -->
  <div id="site-footer"></div>

  <script src="js/site.js"></script>
</body>
</html>
